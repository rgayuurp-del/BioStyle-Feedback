name: "玩法建議（繁體中文）"
description: "分享對招式、套路、操作手感或介面的建議。"
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: "你希望怎麼改？"
      description: "可以從一次具體的遊戲體驗說起。"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "哪個情境最需要這項改動？（選填）"
      description: "例如，持武器切換套路時，希望能看清楚目前的架勢。"
    validations:
      required: false
