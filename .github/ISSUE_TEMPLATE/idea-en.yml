name: "Gameplay Suggestion (English)"
description: "Suggest changes to moves, styles, controls, or the interface."
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: "What would you like to change?"
      description: "Describe the change and how you would use it in-game."
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "When would this help? (optional)"
      description: "For example, switching between armed styles during combat."
    validations:
      required: false
